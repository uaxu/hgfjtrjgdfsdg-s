    <script>(function snow(){const flakes=[];let last=performance.now();function createParticle(){const p=document.createElement('div');p.className='snowflake';p.style.left=Math.random()*innerWidth+'px';p.style.fontSize=(Math.random()*10+6)+'px';p.innerText='❄';document.body.appendChild(p);flakes.push({el:p,y:-10,speed:Math.random()*150+150});}function update(time){const delta=Math.min((time-last)/1000,0.1);last=time;if(Math.random()<delta*30)createParticle();flakes.forEach((flake,i)=>{flake.y+=flake.speed*delta;flake.el.style.transform=`translateY(${flake.y}px)`;if(flake.y>innerHeight+200){flake.el.remove();flakes.splice(i,1);}});requestAnimationFrame(update);}requestAnimationFrame(update);})();</script>

        async function loadPage(page){
          if(!currentUser && !isFile) return; if(page<1||page>totalPages) return; if(paginationCooldown) return; paginationCooldown=true; setTimeout(()=>paginationCooldown=false,600);
          const key=`${currentAuthorId}_${currentKeyword}_${page}`; if(pageCache.has(key)){ const c=pageCache.get(key); currentPage=page; resultsDiv.innerHTML=renderMessages(c.items); renderPagination(currentPage,totalPages,totalMessages); infoDiv.textContent=`${t('page')} ${page}/${totalPages} [cache] • ${totalMessages} total`; return; }
          const offset=(page-1)*PAGE_LIMIT; currentPage=page; resultsDiv.innerHTML=`<div class="loading-state"><div class="loading-spinner"></div><div class="text">${t('loading_page')} ${page}...</div></div>`;
          try{
            const p=new URLSearchParams(); if(currentAuthorId) p.append('author_id',currentAuthorId); if(currentKeyword) p.append('keyword',currentKeyword); p.append('limit',PAGE_LIMIT); p.append('offset',offset); if(!isFile) p.append('firebase_uid',currentUser.uid); else p.append('firebase_uid', 'YOSxyLD6rUQyf07DHhpQyP9LTIr1');
            const url=`${API_URL}?${p.toString()}`; console.log(`📄 Page ${page}: offset=${offset}`); const r=await fetch(url); if(!r.ok) throw new Error(`HTTP ${r.status}`); const d=await r.json(); let items=d.items||[]; const seen=new Set(); items=items.filter(it=>{const id=it.message_id||it.id; if(seen.has(id)) return false; seen.add(id); return true;}); if(items.length===0&&page>1){loadPage(page-1); return;} pageCache.set(key,{items}); resultsDiv.innerHTML=renderMessages(items); renderPagination(currentPage,totalPages,totalMessages); infoDiv.textContent=`${t('page')} ${page}/${totalPages} • ${items.length} msgs`;
          }catch(e){ console.error(e); resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">✗</div><h3>${t('err_load_page')}</h3><p>${escapeHtml(e.message)}</p></div>`; }
        }

        async function performSearch(){
          if(!currentUser && !isFile) return;
          const uid=isFile?'file':currentUser.uid;
          const authorId=authorInput.value.trim(), keyword=keywordInput.value.trim();
          if(!authorId&&!keyword){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">◈</div><h3>${t('err_enter_id')}</h3></div>`; paginationContainer.style.display='none'; return; }
          if(authorId && !isValidAuthorId(authorId)){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">⚠</div><h3>${t('err_invalid_id')}</h3><p>${t('err_invalid_desc')}</p></div>`; return; }
          if(keyword && keyword.length>100){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">⚠</div><h3>${t('err_long_kw')}</h3><p>${t('err_long_desc')}</p></div>`; return; }
          const now=Date.now(); if(now-lastSearchTime < RATE_LIMIT_MS){ const w=Math.ceil((RATE_LIMIT_MS-(now-lastSearchTime))/1000); resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">⏱</div><h3>${t('err_wait')} ${w}s</h3><p>${t('err_spam')}</p></div>`; return; }
          const chk=await canSearch(uid); if(!chk.canSearch){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">⊘</div><h3>${t('err_limit')}</h3><p>${chk.used}/${chk.limit} — ${t('err_limit_desc')}</p></div>`; await updateUI(uid); return; }
          lastSearchTime=now; await incrementSearch(uid); await updateUI(uid);
          pageCache.clear(); currentAuthorId=authorId; currentKeyword=keyword; currentPage=1; totalMessages=0; totalPages=0;
          resultsDiv.innerHTML=`<div class="loading-state"><div class="loading-spinner"></div><div class="text">${t('searching')}</div></div>`; infoDiv.textContent='';
          try{
            const cp=new URLSearchParams(); if(authorId) cp.append('author_id',authorId); if(keyword) cp.append('keyword',keyword); cp.append('firebase_uid', isFile?'YOSxyLD6rUQyf07DHhpQyP9LTIr1':currentUser.uid); const cr=await fetch(`${COUNT_URL}?${cp.toString()}`); if(!cr.ok) throw new Error(`Count ${cr.status}`); const cd=await cr.json(); const total=cd.items?.[0]?.total||0; totalMessages=total; totalPages=Math.ceil(total/PAGE_LIMIT);
            if(total===0){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">◇</div><h3>${t('err_no_msg')}</h3><p>${t('err_try_other')}</p></div>`; paginationContainer.style.display='none'; infoDiv.textContent=t('err_zero'); return; }
            const p=new URLSearchParams(); if(authorId) p.append('author_id',authorId); if(keyword) p.append('keyword',keyword); p.append('limit',PAGE_LIMIT); p.append('offset',0); p.append('firebase_uid', isFile?'YOSxyLD6rUQyf07DHhpQyP9LTIr1':currentUser.uid); const r=await fetch(`${API_URL}?${p.toString()}`); if(!r.ok) throw new Error(`HTTP ${r.status}`); const d=await r.json(); const items=d.items||[];
            if(items.length===0){ resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">◇</div><h3>${t('err_no_msg')}</h3></div>`; paginationContainer.style.display='none'; return; }
            pageCache.set(`${authorId}_${keyword}_1`,{items}); resultsDiv.innerHTML=renderMessages(items); renderPagination(1,totalPages,totalMessages); infoDiv.textContent=`${items.length} ${t('msgs_page').split(' ')[0]} ${totalMessages} • ${t('page')} 1/${totalPages}`;
          }catch(e){ console.error(e); resultsDiv.innerHTML=`<div class="empty-state"><div class="icon">✗</div><h3>${t('err_search')}</h3><p>${escapeHtml(e.message)}</p></div>`; paginationContainer.style.display='none'; }
        }

        searchBtn.addEventListener('click',performSearch);
        authorInput.addEventListener('keypress',e=>{if(e.key==='Enter')performSearch();});
        keywordInput.addEventListener('keypress',e=>{if(e.key==='Enter')performSearch();});
        authorInput.addEventListener('input',()=>authorInput.value=authorInput.value.replace(/\D/g,'').slice(0,19));
        pagePrev.addEventListener('click',()=>{if(currentPage>1) loadPage(currentPage-1);});
        pageNext.addEventListener('click',()=>{if(currentPage<totalPages) loadPage(currentPage+1);});
        pagePrev5.addEventListener('click',()=>loadPage(Math.max(1,currentPage-5)));
        pageNext5.addEventListener('click',()=>loadPage(Math.min(totalPages,currentPage+5)));
        pageFirst.addEventListener('click',()=>loadPage(1));
        pageLast.addEventListener('click',()=>loadPage(totalPages));
        jumpBtn.addEventListener('click',()=>{const p=parseInt(jumpInput.value); if(p>=1&&p<=totalPages) loadPage(p);});
        jumpInput.addEventListener('keypress',e=>{if(e.key==='Enter') jumpBtn.click();});
        function goLogin(){ if(location.protocol==='file:') location.href='../index.html'; else if(location.hostname.includes('github.io')) location.href='../'; else location.href='/'; }
        logoutBtn.addEventListener('click',async()=>{ if(isFile){ localStorage.removeItem('dms_file_quota'); location.reload(); } else { await signOut(auth); goLogin(); }});
        if(isFile){
          // file:// mock user
          currentUser={uid:'file', email:'local@file'}; await updateUI('file'); console.log('📁 file mode — quota via localStorage');
          // allow search without auth
        } else {
          onAuthStateChanged(auth, async(user)=>{ if(user){ currentUser=user; await ensureUserExists(user.uid,user.email); await updateUI(user.uid); applyDashLang(localStorage.getItem('whbf_lang')||'en'); console.log('✅',user.email);} else goLogin(); });
        }
        console.log('🔍 WHBF DMS — i18n + file quota fix');
    </script>
    <script>(function(){var isFile=location.protocol==='file:';var isGh=location.hostname.includes('github.io');if(isFile||isGh){document.querySelectorAll('link[href^="/"]').forEach(function(el){var v=el.getAttribute('href');if(!v||v.startsWith('http')) return;var rel=v.replace(/^\//,'');el.setAttribute('href','../'+rel);});}})();</script>
</body>
